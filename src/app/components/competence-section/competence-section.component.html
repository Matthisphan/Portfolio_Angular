<div class="competence-section">
  <video autoplay muted loop playsinline id="backgroundVideo" aria-hidden="true">
    <source src="background_competence.webm" type="video/webm">
  </video>

  <ul class="filterButtons">
    <li><button type="button" [attr.aria-pressed]="selectedGenre === 'all'" (click)="filterSkills('all')">Tout</button></li>
    <li><button type="button" [attr.aria-pressed]="selectedGenre === 'dev'" (click)="filterSkills('dev')">Développement</button></li>
    <li><button type="button" [attr.aria-pressed]="selectedGenre === 'design'" (click)="filterSkills('design')">Design</button></li>
    <li><button type="button" [attr.aria-pressed]="selectedGenre === 'divers'" (click)="filterSkills('divers')">Divers</button></li>
  </ul>

  <div class="containerGrid">
    @for (skill of filteredSkills; track skill.title) {
      <div class="gridItems">
        <img [src]="skill.imageUrl" [alt]="skill.title">
        <h2 class="title">{{ skill.title }}</h2>
      </div>
    }
  </div>
</div>
